name: CI Build & Syntax Verification

on:
  push:
    branches: [ main, dev, features, testing ]
  pull_request:
    branches: [ main, dev ]

jobs:
  verify:
    name: Lint, Build & Syntax Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root and server dependencies
        run: |
          npm install
          npm --prefix server install

      - name: Install client dependencies & build
        run: |
          npm --prefix client install
          npm --prefix client run build

      - name: Lint client
        run: |
          npm --prefix client run lint

      - name: Verify server syntax
        run: |
          node --check server/server.js
          node --check server/services/stockService.js
          node --check server/services/aiService.js
          node --check server/controllers/portfolioController.js
          node --check server/utils/cache.js

