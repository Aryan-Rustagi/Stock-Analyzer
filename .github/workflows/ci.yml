name: CI Build & Syntax Verification

on:
  push:
    branches: [ main, dev, features, testing ]
  pull_request:
    branches: [ main, dev ]

jobs:
  verify:
    name: Lint, Build & Syntax Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root and server dependencies
        run: |
          npm install
          npm --prefix server install

      - name: Install client dependencies & build
        run: |
          npm --prefix client install
          npm --prefix client run build

      - name: Run JavaScript concepts demo syntax check
        run: |
          node -e "require('./server/utils/closureUtils'); console.log('Closure Utils OK');"
          node -e "require('./server/utils/hoistingDemo'); console.log('Hoisting Demo OK');"
          node -e "require('./server/utils/promiseVsCallback'); console.log('Promise vs Callback Demo OK');"
          node -e "require('./server/utils/asyncAwaitDemo'); console.log('Async/Await Demo OK');"
